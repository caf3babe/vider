apiVersion: apps/v1
kind: Deployment
metadata:
  name: vider
  labels:
    app: vider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vider
  template:
    metadata:
      labels:
        app: vider
    spec:
      containers:
        - name: vider
          image: ghcr.io/caf3babe/vider:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
