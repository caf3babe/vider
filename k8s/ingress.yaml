apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    app.kubernetes.io/instance: vider
    app.kubernetes.io/name: vider
  name: vider
  namespace: default
spec:
  rules:
  - host: vider.strasser.me
    http:
      paths:
      - backend:
          service:
            name: vider
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
